<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf9f7f1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;stage.appendChild(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.001,10),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
 scene.add(new THREE.HemisphereLight(0xffffff,0x788371,1.7));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-.3,1,.5);scene.add(light);const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(.5,.4,-.4);scene.add(fill);
 function view(name){const head=new THREE.Vector3(.009,.65,-.003);if(name==='whole'){controls.target.set(.005,.335,0);camera.position.set(.18,.40,1.10)}else{controls.target.copy(head);const direction=new THREE.Vector3(0,.69,.72).normalize().multiplyScalar(name==='back'?-.24:.24);camera.position.copy(head).add(direction)}controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));stage.dataset.view=name;}
 function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();view('whole');
 new GLTFLoader().load('v3/stem.glb',gltf=>{scene.add(gltf.scene);let triangles=0;gltf.scene.traverse(o=>{if(o.isMesh)triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3});status.textContent=`已载入 · 单支候选 · ${triangles.toLocaleString('zh-CN')} 个三角面`;stage.dataset.loaded='true';},undefined,e=>{console.error(e);status.textContent='模型载入失败，请检查本地预览服务。';stage.dataset.loaded='false'});
 document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>view(button.dataset.view)));
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
}catch(e){console.error(e);status.textContent='此环境无法创建 3D 预览，可查看下方渲染图片。'}
</script>
